name: Sync opensrc

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm run sync:opensrc
      - name: Bump wrapper version if upstream changed
        run: |
          if [ -n "$(git status --porcelain package.json package-lock.json skills/opensrc/SKILL.md LICENSE)" ]; then
            npm version patch --no-git-tag-version
          fi
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync/opensrc-latest
          title: "Sync latest opensrc"
          commit-message: "Sync latest opensrc"
          body: "Automated sync of the upstream opensrc npm package and Pi skill."
