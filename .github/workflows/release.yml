name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - id: package
        name: Resolve package version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="v${version}"

          if [ "$EVENT_NAME" = "release" ] && [ "$RELEASE_TAG" != "$tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $tag" >&2
            exit 1
          fi

          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            published=true
          else
            published=false
          fi

          {
            echo "name=$name"
            echo "version=$version"
            echo "tag=$tag"
            echo "published=$published"
          } >> "$GITHUB_OUTPUT"
      - name: Skip already published version
        if: steps.package.outputs.published == 'true'
        run: echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already published."
      - name: Verify package
        if: steps.package.outputs.published != 'true'
        run: npm run check
      - name: Verify release tag availability
        if: steps.package.outputs.published != 'true' && github.event_name != 'release'
        env:
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            tag_sha=$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')
            if [ -z "$tag_sha" ]; then
              tag_sha=$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')
            fi
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already exists at $tag_sha, not current commit $GITHUB_SHA" >&2
              exit 1
            fi
          fi
      - name: Publish to npm
        if: steps.package.outputs.published != 'true'
        run: npm publish --provenance --access public
      - name: Create GitHub release
        if: steps.package.outputs.published != 'true' && github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$NAME $TAG" \
            --notes "Published \`$NAME@$VERSION\` to npm with provenance."
